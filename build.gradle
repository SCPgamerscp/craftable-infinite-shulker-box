// Root project of a multi-version Forge mod.
//
// The root project resolves the plugin versions but does not apply them
// (`apply false`): every ForgeGradle setup lives in `versions/<mc_version>` so
// that each Minecraft version gets its own mappings, toolchain and Mixin
// version. Declaring the plugins here puts them on the build script classpath,
// which lets the subprojects apply them by id without repeating the version.
//
// Useful tasks:
//   ./gradlew build                        - build every supported version
//   ./gradlew :versions:1.20.1:build       - build a single version
//   ./gradlew collectJars                  - copy every JAR into build/libs

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' apply false
}

// `versions` itself is only a container for the per-version projects and has no
// build logic, so select the leaf projects that actually produce a JAR.
def versionProjects = subprojects.findAll { it.parent?.name == 'versions' }

tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copies the JAR of every supported Minecraft version into build/libs.'

    versionProjects.each { versionProject ->
        dependsOn "${versionProject.path}:build"
    }

    from(versionProjects.collect { it.layout.buildDirectory.dir('libs') }) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
