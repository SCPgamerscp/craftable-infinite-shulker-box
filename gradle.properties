# Low-memory friendly defaults. ForgeGradle forks external JVMs (Access
# Transformer, renamer, decompiler) that inherit JAVA_TOOL_OPTIONS rather than
# these settings, so on a small machine also export e.g.
#   JAVA_TOOL_OPTIONS=-Xmx1600m
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false

# Shared mod metadata. Everything that differs per Minecraft version lives in
# versions/<mc_version>/gradle.properties instead.
mod_id=craftable_infinite_shulker_box
mod_name=Craftable Infinite Shulker Box
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.molishaai97art.craftableinfiniteshulkerbox
mod_authors=molishaai97-art contributors
mod_description=Allows vanilla shulker boxes to be nested without a depth limit and adds a recipe that crafts one shulker box from nine chests.
